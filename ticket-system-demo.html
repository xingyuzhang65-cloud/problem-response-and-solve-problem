<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B端问题反馈系统 - 高保真Demo</title>
<style>
/* ===== CSS Variables / Design Tokens ===== */
:root {
  --primary: #4F46E5;
  --primary-dark: #4338CA;
  --primary-light: #EEF2FF;
  --success: #059669;
  --success-light: #ECFDF5;
  --warning: #D97706;
  --warning-light: #FFFBEB;
  --danger: #DC2626;
  --danger-light: #FEF2F2;
  --info: #2563EB;
  --info-light: #EFF6FF;

  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --gray-600: #4B5563;
  --gray-700: #374151;
  --gray-800: #1F2937;
  --gray-900: #111827;

  --sidebar-w: 220px;
  --header-h: 56px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--gray-50);
  color: var(--gray-800);
  line-height: 1.6;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--gray-900);
  color: #fff;
  display: flex; flex-direction: column;
  flex-shrink: 0;
  z-index: 10;
  transition: transform var(--transition);
}
.sidebar-logo {
  padding: 18px 20px;
  font-size: 16px; font-weight: 700;
  border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; gap: 10px;
  letter-spacing: .5px;
}
.sidebar-logo .icon { width: 28px; height: 28px; background: var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.sidebar-section { padding: 16px 20px 8px; font-size: 11px; text-transform: uppercase; color: var(--gray-400); letter-spacing: 1px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; margin: 2px 8px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--gray-300);
  font-size: 13px;
  transition: all var(--transition);
  user-select: none;
  white-space: nowrap;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--primary); color: #fff; font-weight: 500; }
.nav-item .badge {
  margin-left: auto;
  background: var(--danger);
  color: #fff;
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 20px; text-align: center;
}
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--gray-400);
}
.sidebar-footer .avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px;
}

/* ===== Main Area ===== */
.main {
  flex: 1;
  display: flex; flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Header */
.header {
  height: var(--header-h);
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
}
.header-left h1 { font-size: 18px; font-weight: 600; color: var(--gray-900); }
.header-left .breadcrumb { font-size: 12px; color: var(--gray-400); margin-top: -2px; }
.header-right { display: flex; align-items: center; gap: 16px; }
.role-badge {
  font-size: 12px; padding: 4px 12px; border-radius: 20px;
  font-weight: 500;
}
.role-badge.client { background: var(--info-light); color: var(--info); }
.role-badge.admin { background: var(--warning-light); color: var(--warning); }

/* Content Area */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

/* ===== Cards ===== */
.card {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--gray-200);
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--gray-100);
  display: flex; align-items: center; justify-content: space-between;
}
.card-header h3 { font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }
.card-footer { padding: 14px 20px; border-top: 1px solid var(--gray-100); background: var(--gray-50); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 0;
  border-bottom: 2px solid var(--gray-200);
  margin-bottom: 20px;
}
.tab {
  padding: 10px 20px;
  cursor: pointer;
  font-size: 13px; font-weight: 500;
  color: var(--gray-500);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab:hover { color: var(--gray-700); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab .count { margin-left: 6px; background: var(--gray-200); padding: 0 6px; border-radius: 10px; font-size: 11px; }
.tab.active .count { background: var(--primary-light); color: var(--primary); }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border: 1px solid transparent;
  border-radius: 6px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  font-family: inherit;
  text-decoration: none;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #047857; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-warning:hover { background: #B45309; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #B91C1C; }
.btn-outline { border-color: var(--gray-300); background: #fff; color: var(--gray-700); }
.btn-outline:hover { border-color: var(--gray-400); background: var(--gray-50); }
.btn-ghost { background: transparent; color: var(--gray-600); border-color: transparent; }
.btn-ghost:hover { background: var(--gray-100); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-lg { padding: 10px 24px; font-size: 15px; }
.btn-group { display: flex; gap: 8px; }

/* ===== Forms ===== */
.form-group { margin-bottom: 18px; }
.form-label {
  display: block;
  font-size: 13px; font-weight: 600;
  color: var(--gray-700);
  margin-bottom: 6px;
}
.form-label .required { color: var(--danger); margin-left: 2px; }
.form-hint { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
input[type="text"], input[type="email"], input[type="tel"], textarea, select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--gray-300);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  color: var(--gray-800);
  background: #fff;
  transition: all var(--transition);
  resize: vertical;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.1);
}
textarea { min-height: 100px; }
select { cursor: pointer; }

/* ===== Status Badges ===== */
.status {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 500;
  white-space: nowrap;
}
.status.pending { background: #FEF3C7; color: #92400E; }
.status.in-progress { background: #DBEAFE; color: #1E40AF; }
.status.resolved { background: #D1FAE5; color: #065F46; }
.status.evaluation { background: #EDE9FE; color: #5B21B6; }
.status.closed { background: var(--gray-200); color: var(--gray-600); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.status.pending .status-dot { background: #F59E0B; }
.status.in-progress .status-dot { background: #3B82F6; animation: pulse 1.5s ease-in-out infinite; }
.status.resolved .status-dot { background: #10B981; }
.status.evaluation .status-dot { background: #8B5CF6; }
.status.closed .status-dot { background: var(--gray-400); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

/* Priority */
.priority { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.priority.urgent { background: #FEE2E2; color: #991B1B; }
.priority.high { background: #FEF3C7; color: #92400E; }
.priority.medium { background: #DBEAFE; color: #1E40AF; }
.priority.low { background: var(--gray-100); color: var(--gray-600); }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--gray-100); font-size: 13px; }
th { font-size: 12px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: .5px; background: var(--gray-50); }
tr:hover td { background: var(--gray-50); }
tr.selected td { background: var(--primary-light); }

/* ===== Timeline ===== */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: '';
  position: absolute; left: 11px; top: 4px; bottom: 4px;
  width: 2px; background: var(--gray-200);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -22px; top: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--gray-300);
  background: #fff;
  z-index: 1;
}
.timeline-item.active .timeline-dot { border-color: var(--primary); background: var(--primary); }
.timeline-item.completed .timeline-dot { border-color: var(--success); background: var(--success); }
.timeline-time { font-size: 11px; color: var(--gray-400); }
.timeline-title { font-size: 13px; font-weight: 600; color: var(--gray-800); }
.timeline-desc { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

/* ===== Chat UI ===== */
.chat-area {
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  background: var(--gray-50);
  display: flex; flex-direction: column;
  max-height: 400px;
}
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 200px; max-height: 300px; }
.chat-msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
  animation: fadeInUp .3s ease;
}
.chat-msg.incoming { align-self: flex-start; background: #fff; border: 1px solid var(--gray-200); border-bottom-left-radius: 4px; }
.chat-msg.outgoing { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg .msg-time { font-size: 10px; opacity: .6; margin-top: 4px; }
.chat-msg .msg-author { font-size: 11px; font-weight: 600; margin-bottom: 4px; color: var(--gray-500); }
.chat-msg.outgoing .msg-author { color: rgba(255,255,255,.7); }
.chat-input-area { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--gray-200); background: #fff; border-radius: 0 0 var(--radius) var(--radius); }
.chat-input-area input { flex: 1; }
.chat-system-msg {
  align-self: center;
  font-size: 11px; color: var(--gray-400);
  background: var(--gray-100);
  padding: 4px 12px; border-radius: 10px;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== File Upload ===== */
.upload-zone {
  border: 2px dashed var(--gray-300);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--gray-50);
}
.upload-zone:hover { border-color: var(--primary); background: var(--primary-light); }
.upload-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
.upload-icon { font-size: 32px; color: var(--gray-400); margin-bottom: 8px; }
.upload-text { font-size: 13px; color: var(--gray-600); }
.upload-hint { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
.file-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.file-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--gray-100);
  border-radius: 6px;
  font-size: 12px;
}
.file-chip .remove { cursor: pointer; color: var(--gray-400); font-weight: 700; }
.file-chip .remove:hover { color: var(--danger); }

/* ===== Star Rating ===== */
.stars { display: flex; gap: 4px; font-size: 28px; }
.star { cursor: pointer; color: var(--gray-300); transition: all var(--transition); user-select: none; }
.star:hover { transform: scale(1.2); }
.star.active { color: #F59E0B; }

/* ===== Stats Grid ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: #fff;
  border-radius: var(--radius-lg);
  border: 1px solid var(--gray-200);
  padding: 20px;
  display: flex; align-items: center; gap: 16px;
}
.stat-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.stat-icon.blue { background: var(--info-light); color: var(--info); }
.stat-icon.green { background: var(--success-light); color: var(--success); }
.stat-icon.amber { background: var(--warning-light); color: var(--warning); }
.stat-icon.red { background: var(--danger-light); color: var(--danger); }
.stat-value { font-size: 26px; font-weight: 700; color: var(--gray-900); line-height: 1; }
.stat-label { font-size: 12px; color: var(--gray-500); margin-top: 4px; }
.stat-change { font-size: 11px; margin-top: 2px; }
.stat-change.up { color: var(--success); }
.stat-change.down { color: var(--danger); }

/* ===== Three-column Layout ===== */
.three-col { display: grid; grid-template-columns: 280px 1fr 280px; gap: 16px; height: calc(100vh - var(--header-h) - 120px); }
.three-col .col { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

/* ===== Customer Info Panel ===== */
.info-panel .info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.info-panel .info-label { color: var(--gray-500); }
.info-panel .info-value { font-weight: 500; }
.vip-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.vip-badge.vvip { background: linear-gradient(135deg, #F59E0B, #EF4444); color: #fff; }
.vip-badge.vip { background: #FEF3C7; color: #92400E; }
.vip-badge.normal { background: var(--gray-100); color: var(--gray-600); }

/* ===== Internal Notes ===== */
.internal-note {
  background: #FFFBEB;
  border: 1px solid #FDE68A;
  border-left: 3px solid var(--warning);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
}
.internal-note .note-author { font-weight: 600; color: var(--gray-700); }
.internal-note .note-time { font-size: 11px; color: var(--gray-400); float: right; }
.internal-note .note-body { margin-top: 4px; color: var(--gray-600); }

/* ===== Quick Reply Templates ===== */
.template-chip {
  display: inline-block;
  padding: 4px 10px;
  background: var(--gray-100);
  border: 1px solid var(--gray-200);
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  margin: 3px;
  transition: all var(--transition);
}
.template-chip:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* ===== Modals ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s ease;
}
.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 500px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp .3s ease;
}
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; font-size: 20px; color: var(--gray-400); background: none; border: none; }
.modal-close:hover { color: var(--gray-600); }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--gray-100); display: flex; justify-content: flex-end; gap: 8px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Toast ===== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 13px;
  color: #fff;
  box-shadow: var(--shadow-lg);
  animation: slideIn .3s ease;
  display: flex; align-items: center; gap: 8px;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--info); }
@keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

/* ===== Search / Filter Bar ===== */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-bottom: 16px;
  align-items: center;
}
.filter-bar input, .filter-bar select { width: auto; min-width: 160px; }
.search-input { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
.search-input input { padding-left: 34px; }
.search-input .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: 14px; }

/* ===== Pagination ===== */
.pagination { display: flex; align-items: center; gap: 4px; justify-content: center; margin-top: 16px; }
.page-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: all var(--transition);
}
.page-btn:hover { border-color: var(--primary); color: var(--primary); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ===== Responsive ===== */
@media (max-width: 1200px) {
  .three-col { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .stats-grid { grid-template-columns: 1fr; }
  .filter-bar { flex-direction: column; align-items: stretch; }
}

/* ===== Misc ===== */
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-2 { gap: 8px; }
.mt-3 { margin-top: 16px; }
.mb-3 { margin-bottom: 16px; }
.text-sm { font-size: 12px; }
.text-muted { color: var(--gray-500); }
.text-center { text-align: center; }
.empty-state { text-align: center; padding: 40px; color: var(--gray-400); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.hidden { display: none !important; }

/* ===== Drawer ===== */
.drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 200;
  opacity: 0; visibility: hidden;
  transition: opacity .25s ease, visibility .25s;
}
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 580px; max-width: 100vw;
  background: #fff;
  z-index: 201;
  box-shadow: -8px 0 24px rgba(0,0,0,.12);
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
}
.drawer-overlay.open .drawer { transform: translateX(0); }
.drawer-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.drawer-header h3 { font-size: 16px; font-weight: 600; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.drawer-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--gray-100);
  background: var(--gray-50);
  flex-shrink: 0;
}
.fade-in { animation: fadeIn .3s ease; }

/* ===== Progress Bar (SLA) ===== */
.progress-bar {

// ===== NAVIGATION =====
document.getElementById('sidebarNav').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  const view = item.dataset.view;
  if (view) navigateTo(view);
});

function navigateTo(view, ticketId) {
  APP.currentView = view;
  if (ticketId) APP.currentTicketId = ticketId;

  // Update nav active state: detail views keep parent nav highlighted
  const parentView = view === 'client-detail' ? 'client-list' :
                     view === 'admin-detail' ? 'admin-workbench' : view;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  const navItem = document.querySelector(`[data-view="${parentView}"]`);
  if (navItem) navItem.classList.add('active');

  // Render view
  const content = document.getElementById('contentArea');
  switch (view) {
    case 'client-list': renderClientList(content); break;
    case 'client-detail': renderClientDetail(content, ticketId); break;
    case 'admin-workbench': renderAdminWorkbench(content); break;
    case 'admin-detail': renderAdminDetail(content, ticketId); break;
    case 'admin-dashboard': renderAdminDashboard(content); break;
  }

  // Update header
  updateHeader(view);
}

function updateHeader(view) {
  const titles = {
    'client-list': ['我的工单', '客户端 / 我的工单'],
    'client-detail': ['工单详情', '客户端 / 我的工单 / 工单详情'],
    'admin-workbench': ['工单工作台', '管理端 / 工单工作台'],
    'admin-detail': ['工单处理详情', '管理端 / 工单详情'],
    'admin-dashboard': ['数据看板', '管理端 / 数据看板'],
  };
  const [title, breadcrumb] = titles[view] || [view, ''];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('breadcrumb').textContent = breadcrumb;
}

  document.getElementById('sidebarName').textContent = isAdmin ? '王芳 (客服)' : '李明 (客户)';
  document.getElementById('sidebarRole').textContent = isAdmin ? '客服专员' : '企业用户';
  document.getElementById('sidebarAvatar').textContent = isAdmin ? '王' : '李';

  const badge = document.getElementById('roleBadge');
  badge.textContent = isAdmin ? '🔧 管理端视角' : '👤 客户端视角';
  badge.className = `role-badge ${isAdmin ? 'admin' : 'client'}`;

  // Show/hide admin nav items
  document.querySelectorAll('.sidebar-section').forEach(s => {
    s.style.display = s.textContent.includes('管理端') ? (isAdmin ? '' : 'none') : (isAdmin ? 'none' : '');
  });

  // Navigate to appropriate default
  if (isAdmin) {
    navigateTo('admin-workbench');
  } else {
    navigateTo('client-list');
  }

  showToast(`已切换至${isAdmin ? '管理端' : '客户端'}视角`, 'info');
}

// ===== TOAST =====
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  toast.innerHTML = `${icons[type] || ''} ${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ===== MODAL =====
function showModal(title, bodyHtml, footerHtml) {
  const container = document.getElementById('modalContainer');
  container.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">

        <div class="modal-header">

          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}

function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

// ===== STATUS HELPERS =====
function statusLabel(s) {
  const map = { 'pending': '待处理', 'in-progress': '处理中', 'resolved': '已处理', 'evaluation': '待评价', 'closed': '已关闭' };
  return map[s] || s;
}
function statusClass(s) {
  const map = { 'pending': 'pending', 'in-progress': 'in-progress', 'resolved': 'resolved', 'evaluation': 'evaluation', 'closed': 'closed' };
  return map[s] || '';
}
function priorityClass(p) {
  const map = { 'urgent': 'urgent', 'high': 'high', 'medium': 'medium', 'low': 'low' };
  return map[p] || '';
}
function priorityLabel(p) {
  const map = { 'urgent': '紧急', 'high': '高', 'medium': '中', 'low': '低' };
  return map[p] || p;
}

// ===== SUBMIT DRAWER =====
function openSubmitDrawer() {
  window._drawerFiles = [];

  document.getElementById('submitDrawerOverlay').classList.add('open');

  setTimeout(() => document.getElementById('drawerCat1').focus(), 300);
}

function closeSubmitDrawer() {
  document.getElementById('submitDrawerOverlay').classList.remove('open');
  resetDrawerForm();
}

function updateDrawerCat2() {
  const cat1 = document.getElementById('drawerCat1').value;
  const cat2 = document.getElementById('drawerCat2');
  const opts = {
    '系统BUG': ['页面报错', '数据错误', '性能问题', '兼容性问题'],
    '功能建议': ['新增功能', '体验优化', '接口需求'],
    '账号权限': ['权限异常', '账号开通', '角色配置'],
    '财务费用': ['账单疑问', '发票申请', '退款处理'],
  };
  cat2.innerHTML = '<option value="">请选择二级分类</option>';
  if (opts[cat1]) {
    opts[cat1].forEach(o => { const opt = document.createElement('option'); opt.value = o; opt.textContent = o; cat2.appendChild(opt); });
  }
}

function updateDrawerCharCount() {
  const len = document.getElementById('drawerDesc').value.length;
  document.getElementById('drawerCharCount').textContent = len;
}

function handleDrawerFiles(files) {
  const maxFiles = 5;
  const current = window._drawerFiles.length;
  const remaining = maxFiles - current;
  const toAdd = Math.min(files.length, remaining);

  for (let i = 0; i < toAdd; i++) {
    const file = files[i];
    if (file.size > 20 * 1024 * 1024) { showToast(`文件 ${file.name} 超过20MB限制`, 'error'); continue; }
    window._drawerFiles.push(file);
  }
  if (files.length > remaining) showToast(`最多上传5个文件，已自动选取前${remaining}个`, 'info');
  renderDrawerFileList();
}

function renderDrawerFileList() {
  const container = document.getElementById('drawerFileList');
  if (!container) return;
  container.innerHTML = window._drawerFiles.map((f, i) => `
    <div class="file-chip">
      <span>📄 ${f.name}</span>
      <span class="remove" onclick="removeDrawerFile(${i})">✕</span>
    </div>
  `).join('');
}

function removeDrawerFile(i) { window._drawerFiles.splice(i, 1); renderDrawerFileList(); }

function resetDrawerForm() {
  document.getElementById('drawerCat1').value = '';
  document.getElementById('drawerCat2').innerHTML = '<option value="">请先选择一级分类</option>';
  document.getElementById('drawerModule').value = '';
  document.getElementById('drawerDesc').value = '';
  document.getElementById('drawerContact').value = '138****5678';
  window._drawerFiles = [];
  renderDrawerFileList();
  updateDrawerCharCount();
}

function submitDrawerTicket() {
  const cat1 = document.getElementById('drawerCat1').value;
  const cat2 = document.getElementById('drawerCat2').value;
  const desc = document.getElementById('drawerDesc').value.trim();
  const contact = document.getElementById('drawerContact').value.trim();

  if (!cat1 || !cat2) { showToast('请选择问题分类', 'error'); return; }
  if (!desc) { showToast('请填写问题描述', 'error'); return; }
  if (desc.length < 10) { showToast('问题描述至少需要10个字', 'error'); return; }
  if (!contact) { showToast('请填写联系方式', 'error'); return; }

  const newId = 'TK-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + String(MOCK_TICKETS.length + 1).padStart(3,'0');
  MOCK_TICKETS.unshift({
    id: newId, cat1, cat2, module: document.getElementById('drawerModule').value || '未指定', desc, contact,
    priority: 'medium', status: 'pending', author: '李明', company: '顺丰速运有限公司', vip: 'VIP',
    historyCount: 12, createdAt: new Date().toLocaleString('zh-CN'), updatedAt: new Date().toLocaleString('zh-CN'),
    timeline: [{ time: new Date().toLocaleString('zh-CN'), title: '提交工单', desc: '用户提交了工单', type: 'submit' }],
    messages: [{ from: 'user', author: '李明', text: desc, time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) }],
    internalNotes: [],
  });

  closeSubmitDrawer();
  showToast('🎉 工单提交成功！工单号：' + newId, 'success');
  // Refresh the list in-place
  renderClientList(document.getElementById('contentArea'));
}

function renderChatMessages(t) {
  return t.messages.map(m => {
    if (m.from === 'user') {
      return `<div class="chat-msg outgoing"><div class="msg-author">${m.author}</div>${m.text}<div class="msg-time">${m.time}</div></div>`;
    } else {
      return `<div class="chat-msg incoming"><div class="msg-author">${m.author}</div>${m.text}<div class="msg-time">${m.time}</div></div>`;
    }
  }).join('');
}

function sendClientMsg(ticketId) {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  const t = MOCK_TICKETS.find(tk => tk.id === ticketId);
  if (!t) return;

  const now = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  t.messages.push({ from: 'user', author: '李明', text, time: now });

  const msgs = document.getElementById('chatMsgs');
  if (msgs) {
    const div = document.createElement('div');
    div.className = 'chat-msg outgoing';
    div.innerHTML = `<div class="msg-author">李明</div>${text}<div class="msg-time">${now}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  input.value = '';
  input.focus();
  showToast('消息已发送', 'success');

  // Simulate auto-reply after 2s if in progress
  if (t.status === 'in-progress') {
    setTimeout(() => {
      const replyTime = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      t.messages.push({ from: 'agent', author: '王芳 (客服)', text: '收到您的补充信息，我们会尽快处理。如有更多问题请随时沟通。', time: replyTime });
      if (msgs) {
        const div2 = document.createElement('div');
        div2.className = 'chat-msg incoming';
        div2.innerHTML = `<div class="msg-author">王芳 (客服)</div>收到您的补充信息，我们会尽快处理。如有更多问题请随时沟通。<div class="msg-time">${replyTime}</div>`;
        msgs.appendChild(div2);
        msgs.scrollTop = msgs.scrollHeight;
      }
      showToast('客服已回复', 'info');
    }, 2000);
  }
}

function selectModalStar(n) {

function submitEvalAndClose(ticketId) {
  const t = MOCK_TICKETS.find(tk => tk.id === ticketId);
  if (!t) return;
  const rating = window._modalRating || 5;
  const text = document.getElementById('modalEvalText')?.value || '';

  t.status = 'closed';
  const now = new Date().toLocaleString('zh-CN');

  t.timeline.push({ time: now, title: '已关闭', desc: `用户确认解决并给出${rating}星评价`, type: 'close' });
  if (text) t.messages.push({ from: 'user', author: t.author, text: `[评价] ${'★'.repeat(rating)} ${text}`, time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) });

  closeModal();
  showToast(`✅ 工单已关闭，感谢您的${rating}星评价！`, 'success');
  setTimeout(() => navigateTo('client-detail', ticketId), 500);
}

function reopenTicket(ticketId) {
  const t = MOCK_TICKETS.find(tk => tk.id === ticketId);
  if (!t) return;
  t.status = 'in-progress';
  const now = new Date().toLocaleString('zh-CN');
  t.updatedAt = now;
  t.timeline.push({ time: now, title: '重开工单', desc: '用户反馈问题未解决，申请重开工单', type: 'reopen' });
  t.messages.push({ from: 'user', author: t.author, text: '问题还没有完全解决，请继续处理。', time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) });

  showToast('工单已重新打开，客服将重新处理', 'info');
  navigateTo('client-detail', ticketId);
}

function switchAdminView(view) {
  window._adminView = view;
  renderAdminWorkbench(document.getElementById('contentArea'));
}

function searchAdminTickets() {
  const query = document.getElementById('adminSearch')?.value?.toLowerCase() || '';
  const statusFilter = document.getElementById('adminStatusFilter')?.value || '';
  const priorityFilter = document.getElementById('adminPriorityFilter')?.value || '';
  const rows = document.querySelectorAll('#adminTicketTableBody tr');
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    const statusCell = row.querySelector('.status');
    const priorityCell = row.querySelector('.priority');
    const matchSearch = !query || text.includes(query);
    const matchStatus = !statusFilter || (statusCell && statusCell.textContent.includes(statusLabel(statusFilter)));
    const matchPriority = !priorityFilter || (priorityCell && priorityCell.textContent.includes(priorityLabel(priorityFilter)));
    row.style.display = matchSearch && matchStatus && matchPriority ? '' : 'none';
  });
}

function toggleSelectAll(checkbox) {
  document.querySelectorAll('.ticket-check').forEach(cb => cb.checked = checkbox.checked);
}

function batchTransfer() {
  const selected = [...document.querySelectorAll('.ticket-check:checked')].map(cb => cb.value);
  if (selected.length === 0) { showToast('请先勾选工单', 'error'); return; }
  showModal('批量转交工单', `
    <p style="margin-bottom:12px;">已选择 <strong>${selected.length}</strong> 个工单，请选择接收人：</p>
    <select style="width:100%;"><option>李磊 (客服)</option><option>张伟 (研发)</option><option>产品经理-陈</option><option>IT-赵</option></select>

function renderAdminTimeline(t) {
  const allItems = [];
  t.timeline.forEach(item => {
    allItems.push({ type: 'system', time: item.time, title: item.title, desc: item.desc });
  });
  t.messages.forEach(m => {
    allItems.push({ type: m.from === 'user' ? 'user' : 'agent', time: m.time, author: m.author, text: m.text });
  });
  // Sort by time
  allItems.sort((a, b) => a.time.localeCompare(b.time));

  return allItems.map(item => {
    if (item.type === 'system') {
      return `<div class="chat-system-msg">🔔 ${item.time} — ${item.title}：${item.desc}</div>`;
    } else if (item.type === 'user') {
      return `<div class="chat-msg outgoing"><div class="msg-author">${item.author}</div>${item.text}<div class="msg-time">${item.time}</div></div>`;
    } else {
      return `<div class="chat-msg incoming"><div class="msg-author">${item.author}</div>${item.text}<div class="msg-time">${item.time}</div></div>`;
    }
  }).join('');
}

function useTemplate(i) {
  const input = document.getElementById('adminChatInput');
  if (input) input.value = QUICK_TEMPLATES[i];
}

function sendAdminMsg(ticketId) {
  const input = document.getElementById('adminChatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  const t = MOCK_TICKETS.find(tk => tk.id === ticketId);
  if (!t) return;

  const now = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  t.messages.push({ from: 'agent', author: '王芳 (客服)', text, time: now });

  const msgs = document.getElementById('adminChatMsgs');
  if (msgs) {
    const div = document.createElement('div');
    div.className = 'chat-msg incoming';
    div.innerHTML = `<div class="msg-author">王芳 (客服)</div>${text}<div class="msg-time">${now}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  input.value = '';
  input.focus();
  showToast('已发送给客户', 'success');
}

function changeTicketStatus(ticketId) {
  const sel = document.getElementById('statusChange');
  if (!sel || !sel.value) { showToast('请选择目标状态', 'error'); return; }
  const t = MOCK_TICKETS.find(tk => tk.id === ticketId);
  if (!t) return;

  const newStatus = sel.value;
  t.status = newStatus;
  const now = new Date().toLocaleString('zh-CN');
  t.updatedAt = now;
  t.timeline.push({ time: now, title: `状态变更为：${statusLabel(newStatus)}`, desc: '管理员手动更新了工单状态', type: 'status_change' });
  t.messages.push({ from: 'agent', author: '王芳 (客服)', text: `工单状态已更新为：${statusLabel(newStatus)}`, time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) });

  showToast(`工单状态已更新为：${statusLabel(newStatus)}`, 'success');
  setTimeout(() => navigateTo('admin-detail', ticketId), 500);
}

function addInternalNote(ticketId) {
  const input = document.getElementById('internalNoteInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  const t = MOCK_TICKETS.find(tk => tk.id === ticketId);
  if (!t) return;

  const now = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  t.internalNotes.push({ author: '王芳', time: now, text });

  input.value = '';
  showToast('内部备注已添加（仅内部可见）', 'success');
  navigateTo('admin-detail', ticketId);
}

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    switch (e.key) {
      case '1': e.preventDefault(); navigateTo('client-list'); break;
      case '2': e.preventDefault(); navigateTo('admin-workbench'); break;
      case '3': e.preventDefault(); navigateTo('admin-dashboard'); break;
      case 'n': e.preventDefault(); openSubmitDrawer(); break;
    }
  }
});
